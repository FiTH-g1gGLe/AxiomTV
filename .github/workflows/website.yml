name: Deploy website

# Deploys website/ (the AxiomTV site) to Cloudflare Workers. Uses the CLOUDFLARE_API_TOKEN secret.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Deploy
        run: |
          set -euo pipefail
          npm install -g wrangler@4
          wrangler deploy > deploy.log 2>&1 || { cat deploy.log; exit 1; }
          cat deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "Website: $url"
          for i in $(seq 1 15); do curl -fsS -o /dev/null "$url/" && break; sleep 5; done
          curl -fsS "$url/" | grep -q "AXIOMTV"
          curl -fsS -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "$url/get"

      - name: Save deploy log on failure
        if: failure()
        working-directory: .
        run: |
          cp website/deploy.log /tmp/deploy.log 2>/dev/null || echo "no log" > /tmp/deploy.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan site-logs-tmp
          git rm -rf --cached . > /dev/null
          grep -v -i "token" /tmp/deploy.log | tail -n 80 > deploy.log
          echo "run ${{ github.run_number }} commit ${GITHUB_SHA::7}" > info.txt
          git add -f deploy.log info.txt
          git commit -q -m "Website deploy ${{ github.run_number }} failed"
          git push -f origin HEAD:refs/heads/site-logs
