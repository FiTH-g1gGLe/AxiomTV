name: Build AxiomTV

# Builds the app on every push and publishes it as a GitHub release.
# Install on a Fire Stick with Downloader using:
#   https://github.com/FiTH-g1gGLe/AxiomTV/releases/latest/download/AxiomTV.apk

on:
  push:
    branches:
      - main
      - "phase-*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Fetch brand font (Michroma, SIL Open Font License)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/michroma.ttf https://github.com/google/fonts/raw/main/ofl/michroma/Michroma-Regular.ttf

      - name: Build the app
        env:
          # Required: a GitHub token with read:packages so the build pulls in the
          # real mpv engine and FFmpeg decoders from wholphin-extensions.
          EXTENSIONS_TOKEN: ${{ secrets.EXTENSIONS_TOKEN }}
          # TMDB key for posters, fanart and cast (Phase 4)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [[ -n "$EXTENSIONS_TOKEN" ]]; then
            echo "Using real mpv + FFmpeg from wholphin-extensions"
            export ORG_GRADLE_PROJECT_WholphinExtensionsUsername="${{ github.repository_owner }}"
            export ORG_GRADLE_PROJECT_WholphinExtensionsPassword="$EXTENSIONS_TOKEN"
          else
            echo "::error::EXTENSIONS_TOKEN secret not set - AxiomTV needs it for the mpv engine"
            exit 1
          fi
          set -o pipefail
          ./gradlew assembleDefaultRelease 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          [[ -f build.log ]] || echo "Build log missing" > build.log
          cp build.log /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          tail -n 400 /tmp/build.log > failure.log
          grep -n -E "^e: |error:|What went wrong|FAILURE|Could not" -A4 /tmp/build.log | head -300 > errors.log || true
          echo "run ${{ github.run_number }} commit ${GITHUB_SHA::7}" > info.txt
          git add -f failure.log errors.log info.txt
          git commit -q -m "Build ${{ github.run_number }} failed"
          git push -f origin HEAD:refs/heads/ci-logs

      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/default/release/*.apk; do
            name="$(basename "$f" | sed 's/-default//')"
            cp "$f" "dist/$name"
          done
          cp dist/AxiomTV-release.apk dist/AxiomTV.apk
          ls -la dist
          sha256sum dist/*.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AxiomTV-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          echo "AxiomTV build ${VERSION} from \`${{ github.ref_name }}\` (${GITHUB_SHA::7})." > notes.txt
          echo "" >> notes.txt
          echo "Fire Stick (Downloader): https://github.com/${{ github.repository }}/releases/latest/download/AxiomTV.apk" >> notes.txt
          gh release create "v${VERSION}" dist/*.apk \
            --title "${VERSION}" --notes-file notes.txt --target "${GITHUB_SHA}" --latest

      - name: Keep only the newest 5 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag -y || true
            done
