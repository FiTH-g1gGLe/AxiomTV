name: Build AxiomTV

# Signed with key rotation (axiomtv -> axiomtv2). Builds the app on every push and publishes it as a GitHub release.
# Install with Downloader using get.axiomtv.co.uk (which points at the latest release's AxiomTV.apk).

on:
  push:
    branches:
      - main
      - "phase-*"
    paths-ignore:
      - "native/**"
      - ".github/workflows/native.yml"
      - "licence-server/**"
      - ".github/workflows/licence-server.yml"
      - "website/**"
      - ".github/workflows/cleanup-releases.yml"
      - ".github/workflows/website.yml"
      - ".github/workflows/licence-backup.yml"
      - "README.md"
      - "TRADEMARKS.md"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Fetch brand font (Michroma, SIL Open Font License)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/michroma.ttf https://github.com/google/fonts/raw/main/ofl/michroma/Michroma-Regular.ttf

      - name: Fetch native playback libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          gh release download native-libs --dir app/libs --pattern "*.aar" --clobber
          ls -la app/libs

      - name: Unlock signing keys
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::Add the SIGNING_PASSPHRASE secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/signing.enc -pass env:SIGNING_PASSPHRASE | tar -xz -C app
          ls -la app/*.keystore

      - name: Build the app
        env:
          # TMDB key for posters, fanart and cast
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleDefaultRelease 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          [[ -f build.log ]] || echo "Build log missing" > build.log
          cp build.log /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          tail -n 400 /tmp/build.log > failure.log
          grep -n -E "^e: |error:|What went wrong|FAILURE|Could not" -A4 /tmp/build.log | head -300 > errors.log || true
          echo "run ${{ github.run_number }} commit ${GITHUB_SHA::7}" > info.txt
          git add -f failure.log errors.log info.txt
          git commit -q -m "Build ${{ github.run_number }} failed"
          git push -f origin HEAD:refs/heads/ci-logs

      - name: Rename APKs
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/default/release/*.apk; do
            name="$(basename "$f" | sed 's/-default//')"
            cp "$f" "dist/$name"
          done
          # Key rotation: Android 9+ moves to the new key (axiomtv2) via a signed hand-over from the old one;
          # older devices keep verifying the old key, so every existing install updates in place.
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" rotate --out lineage.bin \
            --old-signer --ks app/axiomtv.keystore --ks-key-alias axiomtv --ks-pass pass:axiomtv-sideload \
            --new-signer --ks app/axiomtv2.keystore --ks-key-alias axiomtv2 --ks-pass env:SIGNING_PASSPHRASE
          # Every APK gets the hand-over, including the per-processor ones the in-app updater downloads.
          # (Before 0.1.117 only the all-in-one APK had it, so in-app updates failed with "package conflicts".)
          for apk in dist/AxiomTV-release*.apk; do
            "$BT/apksigner" sign \
              --ks app/axiomtv.keystore --ks-key-alias axiomtv --ks-pass pass:axiomtv-sideload \
              --next-signer --ks app/axiomtv2.keystore --ks-key-alias axiomtv2 --ks-pass env:SIGNING_PASSPHRASE \
              --lineage lineage.bin --rotation-min-sdk-version 28 --v4-signing-enabled false \
              --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            "$BT/apksigner" verify "$apk" || { echo "Signing failed for $apk"; exit 1; }
          done
          "$BT/apksigner" verify --verbose --print-certs dist/AxiomTV-release.apk | head -20
          cp dist/AxiomTV-release.apk dist/AxiomTV.apk
          rm -f lineage.bin app/*.keystore
          ls -la dist
          sha256sum dist/*.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AxiomTV-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          # Release notes people read (Discord announcement and the app's update prompt): the commit's title and its "- " lines.
          # A commit with [quiet] in it still releases, but isn't announced on Discord.
          SUBJECT="$(git log -1 --format=%s)"
          {
            echo "## What's new"
            echo "${SUBJECT}" | sed 's/ *\[quiet\]//'
            git log -1 --format=%b | grep -E '^- ' | head -8 || true
            echo ""
            echo "**Update:** open AxiomTV and it offers the update."
            echo "**New install:** in the Downloader app, type **get.axiomtv.co.uk**"
            case "$SUBJECT$(git log -1 --format=%b)" in *"[quiet]"*) echo ""; echo "<!-- quiet -->";; esac
          } > notes.txt
          gh release create "v${VERSION}" dist/*.apk \
            --title "${VERSION}" --notes-file notes.txt --target "${GITHUB_SHA}" --latest
