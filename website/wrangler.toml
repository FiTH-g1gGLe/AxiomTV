# AxiomTV website. Deployed by .github/workflows/website.yml.
name = "axiomtv-site"
main = "src/index.js"
compatibility_date = "2025-09-01"
account_id = "99301ff2a94f8f5ca49c5bb4f8546b8a"
workers_dev = true

# axiomtv.co.uk: the site; get./download. go straight to the app download; www. goes to the main site
routes = [
  { pattern = "axiomtv.co.uk", custom_domain = true },
  { pattern = "www.axiomtv.co.uk", custom_domain = true },
  { pattern = "get.axiomtv.co.uk", custom_domain = true },
  { pattern = "download.axiomtv.co.uk", custom_domain = true },
  { pattern = "discord.axiomtv.co.uk", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# The code in src/index.js runs first, so /get, /backup, /discord and the get./download. addresses work
run_worker_first = true

# Direct line to the licence server (Workers on one account can't reach each other through workers.dev)
[[services]]
binding = "LICENCE"
service = "axiomtv-licence"

[vars]
# Paste your Discord invite here (e.g. https://discord.gg/abc123) and the Contact links go to it
DISCORD_URL = "https://discord.gg/kBzDNRnMys"
# The licence server: axiomtv.co.uk/link/<code> (the payment QR code) is passed through to its /pay page
LICENCE_URL = "https://axiomtv-licence.dj-giggle.workers.dev"
# Where /get sends people: the latest app download
APK_URL = "https://github.com/FiTH-g1gGLe/AxiomTV/releases/latest/download/AxiomTV.apk"
